name: Publish container image

on:
  workflow_dispatch:

concurrency:
  group: publish-image-main
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/rag_eval_ci
      JWT_SECRET_KEY: ci-only-not-a-real-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run test suite
        run: uv run pytest -q

  publish:
    name: Build and publish image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: selragchatbot
      IMAGE_URI: us-central1-docker.pkg.dev/selragchatbot/youtube-chatbot/rag-eval

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: selragchatbot
          workload_identity_provider: projects/832160935565/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@selragchatbot.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: selragchatbot

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set immutable image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build Linux AMD64 image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "${IMAGE_URI}:${IMAGE_TAG}" \
            .

      - name: Push image
        run: docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Record published image
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE_URI}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"